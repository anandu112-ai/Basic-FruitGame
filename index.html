<!DOCTYPE html>
<html>

<head>
<title>Word Puzzle</title>

<style>

body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
margin-top:30px;
transition:0.5s;
}

#box{
background:white;
width:60%;
margin:auto;
padding:40px;
border-radius:15px;
box-shadow:0 0 20px rgba(0,0,0,0.2);
}

#word{
font-size:40px;
letter-spacing:12px;
margin:20px;
}

button{
padding:10px 18px;
margin:4px;
font-size:16px;
cursor:pointer;
border:none;
border-radius:10px;
background:#3498db;
color:white;
transition:0.3s;
}

button:hover{
background:#2980b9;
}

button:disabled{
background:#999;
cursor:not-allowed;
}

#score{
font-size:22px;
margin:10px;
font-weight:bold;
color:#333;
}

#chance{
font-size:20px;
font-weight:bold;
}

#result{
font-size:24px;
font-weight:bold;
margin-top:20px;
}

.win{
animation: flash 0.5s infinite alternate;
}

@keyframes flash{
0%{background:#2ecc71;}
50%{background:#f1c40f;}
100%{background:#e74c3c;}
}

#bottomControls{
margin-top:20px;
}

@media(max-width:768px){

#box{
width:90%;
padding:20px;
}

#word{
font-size:28px;
letter-spacing:8px;
}

button{
font-size:14px;
padding:8px 14px;
}

}

</style>

</head>

<body>

<div id="box">

<h1>Word Puzzle</h1>

<h3>Guess The Fruit 🍏</h3>

<div id="score">Score: 0</div>

<button id="startBtn" onclick="startGame()">
🎮 Start Game
</button>

<p id="word"></p>

<p id="chance"></p>

<p id="result"></p>

<div id="keyboard"></div>

<div id="bottomControls"></div>

</div>

<script>

let secret_word=""
let display=[]
let chance=5
let score=0

function createKeyboard(){

let k=document.getElementById("keyboard")

k.innerHTML=""

for(let i=65;i<=90;i++){

let letter=String.fromCharCode(i)

let btn=document.createElement("button")

btn.innerText=letter

btn.onclick=function(){

guess(letter)

btn.disabled=true

}

k.appendChild(btn)

}

}

async function startGame(){

document.body.classList.remove("win")

document.getElementById("startBtn").style.display="none"

document.getElementById("bottomControls").innerHTML=""

document.getElementById("result").innerText=""

let res=await fetch("/start")

let data=await res.json()

secret_word=data.word.toLowerCase()

display=Array(secret_word.length).fill("_")

chance=5

updateUI()

createKeyboard()

}

function guess(letter){

letter=letter.toLowerCase()

let correct=false

for(let i=0;i<secret_word.length;i++){

if(secret_word[i]==letter){

display[i]=letter

correct=true

}

}

if(!correct){

chance--

}

updateUI()

// WIN
if(!display.includes("_")){

score++

document.getElementById("score").innerText=
"Score: "+score

document.getElementById("result").innerText=
"🎉 You Won! Word: "+secret_word

document.body.classList.add("win")

disableKeyboard()

showNewGameButton()

}

// LOSE
if(chance<=0){

document.getElementById("result").innerText=
"💀 Game Over! Word: "+secret_word

disableKeyboard()

showNewGameButton()

}

}

function updateUI(){

document.getElementById("word").innerText=
display.join(" ")

document.getElementById("chance").innerText=
"Chance: "+chance

}

function disableKeyboard(){

let buttons=
document.querySelectorAll("#keyboard button")

buttons.forEach(btn=>{

btn.disabled=true

})

}

function showNewGameButton(){

document.getElementById("bottomControls").innerHTML=`

<button onclick="startGame()">
🔄 New Game
</button>

`

}

</script>

</body>

</html>
